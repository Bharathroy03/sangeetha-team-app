<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>500 Server Error | Sangeetha Mobiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0D70C0",
                        secondary: "#EE8133",
                        error: "#BA1A1A"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-xl text-center flex flex-col items-center gap-6">
        <div class="w-20 h-20 rounded-full bg-amber-50 border border-amber-100 flex items-center justify-center text-amber-600">
            <span class="material-symbols-outlined text-[48px]">dns</span>
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">System Error</h1>
            <p class="text-sm text-slate-500 leading-relaxed">
                {{ message or "The server encountered an error or database connection failed. Please contact your administrator." }}
            </p>
        </div>
        <div class="w-full space-y-2">
            <a href="/dashboard" class="w-full py-3 bg-[#0D70C0] hover:bg-[#00569E] text-white font-bold text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">dashboard</span>
                Return to Dashboard
            </a>
            <button onclick="window.location.reload()" class="w-full py-3 border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-sm rounded-xl transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">refresh</span>
                Retry Connection
            </button>
        </div>
    </div>
</body>
</html>
