<!-- Transaction Mode Selection Modal -->
<div id="modal-transaction_mode" class="fixed inset-0 z-[110] flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm hidden opacity-0 popup-modal-overlay">
    <div class="absolute inset-0" onclick="closePopupModal('transaction_mode')"></div>
    <div class="relative bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl overflow-hidden shadow-2xl border border-outline-variant flex flex-col transform translate-y-full sm:translate-y-4 sm:scale-95 transition-all duration-300 max-h-[85vh] sm:max-h-[80vh] popup-modal-content">
        <div class="px-5 py-4 bg-[#0D70C0] text-white flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[20px]">payments</span>
                <h3 class="text-sm sm:text-base font-bold">Select Transaction Mode</h3>
            </div>
            <button type="button" onclick="closePopupModal('transaction_mode')" class="text-white/80 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>
        <div class="p-4 overflow-y-auto">
            <div class="flex flex-col gap-2">
                <button type="button" class="option-item flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-100 transition-all text-left group" data-value="Finance" onclick="selectPopupOption('transaction_mode', 'Finance')">
                    <span class="w-8 h-8 rounded-full bg-blue-100 text-primary flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110">
                        <span class="material-symbols-outlined text-[18px]">account_balance</span>
                    </span>
                    <span class="text-sm font-semibold text-slate-700">Finance — EMI Transactions</span>
                </button>
                <button type="button" class="option-item flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-100 transition-all text-left group" data-value="Non-Finance" onclick="selectPopupOption('transaction_mode', 'Non-Finance')">
                    <span class="w-8 h-8 rounded-full bg-green-100 text-emerald-600 flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110">
                        <span class="material-symbols-outlined text-[18px]">money</span>
                    </span>
                    <span class="text-sm font-semibold text-slate-700">Non-Finance — Direct Splits</span>
                </button>
            </div>
        </div>
    </div>
</div>
