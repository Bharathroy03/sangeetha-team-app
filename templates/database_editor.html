<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Database Text Editor | Sangeetha Mobiles</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0D70C0",
                        "secondary": "#EE8133",
                        "tertiary": "#FFFFFF",
                        "neutral-dark": "#1A1C1E",
                        "neutral-light": "#F3F4F6",
                        "outline-variant": "#E5E7EB",
                        "on-surface": "#1A1C1E",
                        "on-surface-variant": "#4B5563",
                        "surface-container-lowest": "#FFFFFF",
                        "surface-container-low": "#F9FAFB",
                        "surface-container": "#F3F4F6",
                        "surface-container-high": "#E5E7EB",
                        "surface-container-highest": "#D1D5DB",
                        "error": "#BA1A1A",
                        "heritage-maroon": "#0D70C0",
                        "prestige-gold": "#EE8133"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-lg": "24px",
                        "stack-sm": "4px",
                        "container-padding": "24px",
                        "stack-md": "12px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "data-mono": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
    <script>
        window.currentUserRole = "{{ session.get('role', 'store_employee') }}";
        window.currentUsername = "{{ session.get('username', '') }}";
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            background-color: #f8f9fa;
        }
        .canvas-area {
            margin-top: 64px;
            min-height: calc(100vh - 64px);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            background-color: #ffffff !important;
            border-color: #0D70C0 !important;
            box-shadow: 0 0 0 2px rgba(13, 112, 192, 0.1);
        }
        /* Toast Alert styling */
        #toastBackdrop {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        #toastBackdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
        .toast-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            width: 90%;
            max-width: 420px;
        }
        .toast {
            pointer-events: auto;
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            position: relative;
            overflow: hidden;
            animation: toastPopIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: all 0.3s ease;
        }
        .toast.success {
            background: #0D70C0;
            border: none;
            border-left: 5px solid #EE8133;
            color: #FFFFFF;
            box-shadow: 0 20px 50px rgba(13, 112, 192, 0.25), 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .toast.error {
            background: #F3F4F6;
            border: none;
            border-left: 5px solid #EE8133;
            color: #1E293B;
            box-shadow: 0 20px 50px rgba(238, 129, 51, 0.15), 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .toast-close {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            font-size: 1.25rem;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .toast.success .toast-close:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.1);
        }
        .toast.error .toast-close:hover {
            color: #1E293B;
            background: rgba(0, 0, 0, 0.05);
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            transform-origin: left;
            animation: toastProgressRun 4s linear forwards;
        }
        .toast.success .toast-progress { background: linear-gradient(90deg, #EE8133, #FF9E59); }
        .toast.error .toast-progress { background: linear-gradient(90deg, #EE8133, #FF9E59); }
        @keyframes toastPopIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes toastProgressRun {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
    </style>
</head>
<body class="font-body-md text-on-surface">
    {% include 'header.html' %}

    <!-- SideNavBar -->
    {% include 'sidebar.html' %}

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

    <!-- Main Canvas Area -->
    <main class="canvas-area p-3 sm:p-6 lg:ml-64">
        <!-- Page Header & Breadcrumb -->
        <div class="mb-6 animate-container-fade-up">
            <nav class="flex mb-1" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-2 text-xs font-semibold text-on-surface-variant/70">
                    <li class="inline-flex items-center">
                        <a href="/dashboard" class="inline-flex items-center hover:text-primary transition-colors gap-1">
                            <span class="material-symbols-outlined text-[16px]">dashboard</span>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <span class="material-symbols-outlined text-[16px] mx-1 text-on-surface-variant/40 flex-shrink-0">chevron_right</span>
                            <span class="text-on-surface font-bold text-slate-800">Database Editor</span>
                        </div>
                    </li>
                </ol>
            </nav>
            <h1 class="text-headline-md font-headline-md font-bold text-slate-800 flex items-center gap-2 mt-2">
                <span class="material-symbols-outlined text-primary text-3xl">edit_note</span>
                Raw Database Text Editor
            </h1>
            <p class="text-xs text-on-surface-variant font-medium mt-1">Directly inspect and modify JSON database records. Validations are enforced on save.</p>
        </div>

        <!-- Editor Control Card -->
        <div class="bg-white border border-outline-variant rounded-2xl shadow-[0px_2px_4px_rgba(0,0,0,0.02)] p-4 sm:p-6 mb-6">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 pb-4 border-b border-slate-100 mb-6">
                <!-- Dropdown selector -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 flex-1">
                    <label for="dbFileSelector" class="text-xs font-bold text-slate-500 uppercase tracking-wider shrink-0 flex items-center gap-1"><span class="material-symbols-outlined text-[#EE8133] text-[18px]">folder_open</span> Select File:</label>
                    <select id="dbFileSelector" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-700 font-semibold focus:bg-white focus:ring-1 focus:ring-primary w-full sm:max-w-xs cursor-pointer">
                        <option value="customers.json">customers.json (Customer Entries)</option>
                        <option value="crm_walkin_customers.json">crm_walkin_customers.json (CRM Logs)</option>
                        <option value="customer_edit_requests.json">customer_edit_requests.json (Edit Requests)</option>
                        <option value="users.json">users.json (User Accounts)</option>
                        <option value="payments.json">payments.json (Payment Tracking)</option>
                    </select>
                </div>
                <!-- Action helpers -->
                <div class="flex items-center gap-2 shrink-0">
                    <button type="button" id="btnFormatJson" class="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-bold rounded-lg transition-all active:scale-95 flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-[16px]">format_align_left</span> Format JSON
                    </button>
                    <button type="button" id="btnResetJson" class="px-4 py-2 border border-slate-200 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-bold transition-all active:scale-95 flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-[16px]">restart_alt</span> Reset Changes
                    </button>
                </div>
            </div>

            <!-- Code/TextArea Container -->
            <div class="relative w-full border border-slate-200 rounded-xl overflow-hidden shadow-inner bg-slate-900 mb-6">
                <div class="bg-slate-800/80 px-4 py-2 border-b border-slate-700 flex justify-between items-center text-[10px] text-slate-400 font-bold uppercase tracking-wider select-none font-data-mono">
                    <span id="editorFileNameLabel">customers.json</span>
                    <span class="text-rose-400 font-bold hidden" id="editorDirtyLabel">● Unsaved Changes</span>
                </div>
                <textarea id="jsonEditorArea" 
                    class="w-full h-[55vh] p-4 bg-slate-950 text-emerald-400 font-data-mono text-sm leading-relaxed resize-y border-0 focus:ring-0 focus:border-0 focus:bg-slate-950 focus:text-emerald-400 font-medium overflow-y-auto outline-none"
                    placeholder="// Select a database file and load content..." spellcheck="false" autocomplete="off"></textarea>
            </div>

            <!-- Main Save action -->
            <div class="flex justify-end gap-3">
                <button type="button" id="btnSaveDb" class="w-full sm:w-auto px-8 py-3 bg-[#EE8133] hover:bg-[#D77227] active:scale-95 text-white font-bold text-sm rounded-lg shadow-lg shadow-orange-100 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">save</span> Save Database File
                </button>
            </div>
        </div>
    </main>

    <!-- Dialogs -->
    <div id="toastBackdrop"></div>
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripting for the Editor -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // DOM Elements
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const sideNav = document.getElementById('side-nav');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const btnLogout = document.getElementById('btnLogout');
        const btnLogoutMobile = document.getElementById('btnLogoutMobile');

        const dbFileSelector = document.getElementById('dbFileSelector');
        const editorFileNameLabel = document.getElementById('editorFileNameLabel');
        const editorDirtyLabel = document.getElementById('editorDirtyLabel');
        const jsonEditorArea = document.getElementById('jsonEditorArea');
        const btnFormatJson = document.getElementById('btnFormatJson');
        const btnResetJson = document.getElementById('btnResetJson');
        const btnSaveDb = document.getElementById('btnSaveDb');

        let originalContent = '';

        // Sidebar logic
        if (mobileMenuToggle && sideNav && sidebarOverlay) {
            const toggleSidebar = () => {
                const isHidden = sideNav.classList.contains('-translate-x-full');
                if (isHidden) {
                    sideNav.classList.remove('-translate-x-full');
                    sidebarOverlay.classList.remove('hidden');
                } else {
                    sideNav.classList.add('-translate-x-full');
                    sidebarOverlay.classList.add('hidden');
                }
            };
            mobileMenuToggle.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
        }

        // Logout logic
        const logoutAction = async () => {
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                if (response.ok) window.location.href = '/login';
            } catch (err) {
                window.location.href = '/login';
            }
        };
        if (btnLogout) btnLogout.addEventListener('click', logoutAction);
        if (btnLogoutMobile) btnLogoutMobile.addEventListener('click', logoutAction);

        // Toast notifications
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconName = type === 'success' ? 'check_circle' : 'error';
            toast.innerHTML = `
                <div class="toast-content">
                    <span class="material-symbols-outlined">${iconName}</span>
                    <span>${message}</span>
                </div>
                <span class="toast-close material-symbols-outlined" onclick="this.parentElement.remove()">close</span>
                <div class="toast-progress"></div>
            `;
            container.appendChild(toast);
            const dismiss = () => {
                toast.style.animation = 'toastPopIn 0.35s ease forwards reverse';
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 350);
            };
            setTimeout(() => { if (toast.parentNode) dismiss(); }, 4000);
        };

        // File loader function
        const loadFileContent = async (fileName) => {
            try {
                editorFileNameLabel.textContent = fileName;
                editorDirtyLabel.classList.add('hidden');
                jsonEditorArea.value = '// Loading database content from server...';
                
                const response = await fetch(`/api/raw-data?file=${fileName}`);
                const res = await response.json();
                if (response.ok && res.success) {
                    originalContent = res.raw || '[]';
                    // Automatically format it for readability
                    try {
                        const parsed = JSON.parse(originalContent);
                        jsonEditorArea.value = JSON.stringify(parsed, null, 4);
                    } catch (e) {
                        jsonEditorArea.value = originalContent;
                    }
                } else {
                    showToast(res.message || 'Failed to load file.', 'error');
                    jsonEditorArea.value = `// Error loading file: ${res.message || 'Unknown server error'}`;
                }
            } catch (err) {
                showToast('Network error while fetching file.', 'error');
                jsonEditorArea.value = '// Network connection error.';
            }
        };

        // Track edits
        jsonEditorArea.addEventListener('input', () => {
            const isDirty = jsonEditorArea.value.trim() !== originalContent.trim();
            if (isDirty) {
                editorDirtyLabel.classList.remove('hidden');
            } else {
                editorDirtyLabel.classList.add('hidden');
            }
        });

        // Dropdown trigger
        dbFileSelector.addEventListener('change', (e) => {
            const chosen = e.target.value;
            loadFileContent(chosen);
        });

        // Format JSON
        btnFormatJson.addEventListener('click', () => {
            const val = jsonEditorArea.value.trim();
            if (!val) return;
            try {
                const parsed = JSON.parse(val);
                jsonEditorArea.value = JSON.stringify(parsed, null, 4);
                showToast('JSON reformatted successfully!', 'success');
            } catch (err) {
                showToast('Invalid JSON syntax. Cannot format.', 'error');
            }
        });

        // Reset changes
        btnResetJson.addEventListener('click', async () => {
            const confirmed = await window.showConfirm('Are you sure you want to discard all unsaved edits?', 'danger', 'Discard Edits');
            if (confirmed) {
                try {
                    const parsed = JSON.parse(originalContent);
                    jsonEditorArea.value = JSON.stringify(parsed, null, 4);
                } catch (e) {
                    jsonEditorArea.value = originalContent;
                }
                editorDirtyLabel.classList.add('hidden');
                showToast('Changes discarded.', 'success');
            }
        });

        // Save database file
        btnSaveDb.addEventListener('click', async () => {
            const fileName = dbFileSelector.value;
            const content = jsonEditorArea.value.trim();

            if (!content) {
                showToast('Cannot save empty file.', 'error');
                return;
            }

            // Check JSON validity before post
            try {
                JSON.parse(content);
            } catch (err) {
                showToast(`JSON Syntax Error: ${err.message}`, 'error');
                return;
            }

            const confirmed = await window.showConfirm(`Are you absolutely sure you want to overwrite ${fileName}? An invalid format could disrupt application systems.`, 'danger', 'Overwrite Database');
            if (!confirmed) {
                return;
            }

            btnSaveDb.disabled = true;
            btnSaveDb.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">sync</span> Saving...';
            window.showLoading('Saving Database File...');

            try {
                const response = await fetch(`/api/raw-data?file=${fileName}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ raw: content })
                });
                const res = await response.json();
                if (response.ok && res.success) {
                    showToast(`${fileName} saved successfully!`, 'success');
                    originalContent = content;
                    editorDirtyLabel.classList.add('hidden');
                } else {
                    showToast(res.message || 'Failed to save file.', 'error');
                }
            } catch (err) {
                showToast('Network error while saving database file.', 'error');
            } finally {
                window.hideLoading();
                btnSaveDb.disabled = false;
                btnSaveDb.innerHTML = '<span class="material-symbols-outlined">save</span> Save Database File';
            }
        });

        // Load default on startup
        loadFileContent('customers.json');
    });
    </script>
</body>
</html>
